<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Teste - Processo de Aprovação (Flowable)</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 0 20px;
        background: #f4f4f4;
    }
    h1 {
        font-size: 22px;
    }
    button {
        background: #2e7d32;
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
    }
    button:hover {
        background: #256428;
    }
    .tarefa {
        background: white;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 12px 16px;
        margin-top: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .tarefa button {
        background: #1565c0;
    }
    .tarefa button:hover {
        background: #0d47a1;
    }
    #status {
        margin-top: 10px;
        font-size: 14px;
        color: #555;
    }
    #listaTarefas {
        margin-top: 20px;
    }
    .vazio {
        color: #888;
        font-style: italic;
    }
</style>
</head>
<body>

    <h1>Teste - Processo de Aprovação</h1>

    <button onclick="iniciarProcesso()">Iniciar Processo</button>
    <button onclick="processoCancelamento()">Canelamento do Processo</button>

    <div id="status"></div>

    
    <h2>Tarefas Pendentes</h2>
    <div id="listaTarefas"></div>

<script>
    async function iniciarProcesso() {
        const status = document.getElementById('status');
        status.textContent = 'Iniciando...';
        try {
            const resposta = await fetch('/processo/processoAprovacao/iniciar', { method: 'POST' });
            const texto = await resposta.text();
            status.textContent = texto;
            carregarTarefas();
        } catch (erro) {
            status.textContent = 'Erro ao iniciar processo: ' + erro;
        }
    }

    async function processoCancelamento(){
        const status = document.getElementById('status');
        status.textContent = "Iniciando...";
        try {
            const resposta = await fetch('/processo/processoCancelamento/iniciar', { method: 'POST' });
            const texto = await resposta.text();
            status.textContent = texto;
            carregarTarefas();
        } catch (error) {
            status.textContent = 'Erro ao iniciar o processo de cancelamento' + error;
        }
    }

    async function completarTarefa(id) {
        try {
            await fetch('/processo/tarefas/' + id + '/completar', { method: 'POST' });
            carregarTarefas();
        } catch (erro) {
            alert('Erro ao completar tarefa: ' + erro);
        }
    }

    async function carregarTarefas() {
        const container = document.getElementById('listaTarefas');
        try {
            const resposta = await fetch('/processo/tarefas');
            const tarefas = await resposta.json();

            if (tarefas.length === 0) {
                container.innerHTML = '<p class="vazio">Nenhuma tarefa pendente.</p>';
                return;
            }

            container.innerHTML = '';
            tarefas.forEach(t => {
                // t é uma string do tipo "id - nome (responsável: x)"
                const partes = t.split(' - ');
                const id = partes[0];
                const resto = partes.slice(1).join(' - ');

                const div = document.createElement('div');
                div.className = 'tarefa';
                div.innerHTML = `<span>${resto}</span>`;

                const botao = document.createElement('button');
                botao.textContent = 'Completar';
                botao.onclick = () => completarTarefa(id);

                div.appendChild(botao);
                container.appendChild(div);
            });
        } catch (erro) {
            container.innerHTML = '<p class="vazio">Erro ao carregar tarefas.</p>';
        }
    }

    // Carrega a lista assim que a página abre
    carregarTarefas();

    // Atualiza a lista automaticamente a cada 5 segundos
    setInterval(carregarTarefas, 5000);
</script>

</body>
</html>
